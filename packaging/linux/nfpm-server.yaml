# The server package (PACKAGING-PLAN.md "Linux packages"). Built by scripts/build-packages.sh from the repository
# root, which sets VERSION (SemVer from MinVer: nfpm writes pre-releases as 0.2.1~alpha.0.5 for deb) and ARCH.
name: spatialaudioserver
version: ${VERSION}
version_schema: semver
arch: ${ARCH}
platform: linux
section: net
priority: optional
maintainer: SpatialAudioServer developers
description: |
  Audio conferencing server (MCU) with spatial audio, for WebRTC clients
  Rooms and participants are managed through a JSON HTTP API; web browsers and
  Second Life / OpenSim viewers connect with WebRTC, and each listener gets their
  own mix (mix-minus, optionally spatial). Built on GStreamer.
homepage: https://github.com/JakDaniels/SpatialAudioServer
license: Apache-2.0

depends:
  - gstreamer1.0-plugins-base (>= 1.24)
  - gstreamer1.0-plugins-good (>= 1.24)
  - gstreamer1.0-plugins-bad (>= 1.24)
  - gstreamer1.0-nice
  - libssl3t64 | libssl3
  - libc6
  - libgcc-s1
  - libstdc++6
recommends:
  - systemd

# The .rpm (Fedora, RHEL 10 and rebuilds): the same contents and scripts, Fedora's package names. openSUSE names
# them differently again (PACKAGING-PLAN.md: a variant of its own, later).
overrides:
  rpm:
    depends:
      - gstreamer1-plugins-base >= 1.24
      - gstreamer1-plugins-good >= 1.24
      - gstreamer1-plugins-bad-free >= 1.24
      - libnice-gstreamer1
      - openssl-libs
      - shadow-utils # useradd, in the install script
      - util-linux # runuser, in the command wrapper
      - glibc
      - libgcc
      - libstdc++
    recommends:
      - systemd

contents:
  # The program: a self-contained .NET publish (runtime included), read-only.
  - src: dist/stage/server
    dst: /usr/lib/spatialaudioserver
    type: tree
  - src: packaging/linux/spatialaudioserver
    dst: /usr/bin/spatialaudioserver
    file_info: { mode: 0755 }
  - src: packaging/linux/spatialaudioserver.service
    dst: /usr/lib/systemd/system/spatialaudioserver.service
    file_info: { mode: 0644 }
  # Site configuration: kept on upgrade and removal (config|noreplace: deb conffiles, rpm %config(noreplace)).
  - src: packaging/linux/appsettings.json
    dst: /etc/spatialaudioserver/appsettings.json
    type: config|noreplace
    file_info: { mode: 0640 }
  - src: packaging/linux/environment
    dst: /etc/spatialaudioserver/environment
    type: config|noreplace
    file_info: { mode: 0640 }
  - src: README.md
    dst: /usr/share/doc/spatialaudioserver/README.md
    file_info: { mode: 0644 }
  - src: docs/running.md
    dst: /usr/share/doc/spatialaudioserver/running.md
    file_info: { mode: 0644 }
  - src: docs/internet.md
    dst: /usr/share/doc/spatialaudioserver/internet.md
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/doc/spatialaudioserver/copyright
    file_info: { mode: 0644 }

scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
  postremove: packaging/linux/postremove.sh
