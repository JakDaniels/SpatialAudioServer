# Builds every package into a GitHub release, then tries them (PACKAGING-PLAN.md "Branches and the GitHub
# workflows"). Called by drafts.yml (the rolling pre-release "develop (draft)") and release.yml (a draft release for
# a version tag, checked and published by hand while the repository is private), so both build the same way.
#   linux    .deb and .rpm (Fedora), server and load tool, x64 and arm64; makes the release with them and SHA256SUMS
#   test     each x64 package installed and tried on its distributions, downloaded from that release
#   windows  the MSIs (x64) with their own GStreamer, tried on the runner, then added to the release and its notes
# Release files, not workflow artefacts: a private repository's Actions storage could not hold them.
name: packages

on:
  workflow_call:
    inputs:
      kind:
        description: "develop-draft: replace the rolling pre-release; release: a draft release for the version tag"
        type: string
        required: true
      tag:
        description: The release's tag (develop-draft, or the version tag such as v0.2.0)
        type: string
        required: true
      version:
        description: When set, the version the build must have (MinVer, from the tag)
        type: string
        default: ''
      ref:
        description: What to build (default the commit that started the run; release.yml after a merge passes the tag)
        type: string
        default: ''
      intro:
        description: The release notes' first part; {version} and {sha} are filled in
        type: string
        required: true
      test:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true

env:
  NFPM_VERSION: 2.48.0
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release: ${{ steps.release.outputs.api }}
    steps:
      # Full history: MinVer needs the tags and the commit count for the version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      # The tags as on GitHub, with their messages (the release notes in the packages' changelog): a checkout for a
      # tag's push may keep that tag without its message.
      - name: Tags
        run: git fetch --force --tags origin

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: nfpm
        run: |
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${archive}"
          echo "${NFPM_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "${archive}" -C /usr/local/bin nfpm
          nfpm --version | tail -n 4

      # arm64 is cross-built here (self-contained .NET publishes do not need an arm64 machine).
      - name: Build the packages (x64)
        run: scripts/build-packages.sh x64

      - name: Build the packages (arm64)
        run: scripts/build-packages.sh arm64

      - name: Make the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ inputs.kind }}
          TAG: ${{ inputs.tag }}
          EXPECTED: ${{ inputs.version }}
          INTRO: ${{ inputs.intro }}
        run: |
          cd dist
          # GitHub turns "~" in a release file's name into "." (0.2.1~alpha.0.5 → 0.2.1.alpha.0.5), which would no
          # longer match SHA256SUMS: name the files with the SemVer version instead. The version inside each package
          # (what apt and dnf read and sort by) keeps its "~".
          for f in *.deb *.rpm; do [ "$f" = "${f//\~/-}" ] || mv "$f" "${f//\~/-}"; done # releases have no "~"
          sha256sum *.deb *.rpm > SHA256SUMS
          version="$(ls spatialaudioserver_*_amd64.deb | sed -E 's/^spatialaudioserver_(.*)_amd64\.deb$/\1/')"
          if [ -n "$EXPECTED" ] && [ "$version" != "$EXPECTED" ]; then
            echo "::error::Built version $version, but the tag says $EXPECTED"
            exit 1
          fi
          intro="${INTRO//\{version\}/$version}"
          printf '%s\n\n' "${intro//\{sha\}/$(git rev-parse --short=7 HEAD)}" > notes.md
          cat >> notes.md <<EOF
          Debian / Ubuntu (server: Ubuntu 24.04, Debian 13 or later; load tool: Ubuntu 22.04 or later), x64 (amd64)
          or arm64:

              sudo apt install ./spatialaudioserver_${version}_amd64.deb
              sudo apt install ./spatialaudioserver-loadtest_${version}_amd64.deb

          Fedora, x64 (x86_64) or arm64 (aarch64):

              sudo dnf install ./spatialaudioserver-${version}-1.x86_64.rpm
              sudo dnf install ./spatialaudioserver-loadtest-${version}-1.x86_64.rpm

          Check the downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`.
          EOF
          if [ "$KIND" = develop-draft ]; then
            # One rolling pre-release: deleted with its tag and made again at the commit built.
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --prerelease --latest=false \
              --title "develop (draft)" --notes-file notes.md *.deb *.rpm SHA256SUMS
          else
            # A draft for the existing version tag (a re-run replaces an earlier draft; a published release stays).
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
              gh release delete "$TAG" --yes
            fi
            prerelease=""
            case "$version" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --verify-tag --draft $prerelease \
              --title "SpatialAudioServer $version" --notes-file notes.md *.deb *.rpm SHA256SUMS
          fi
          # The API address works for drafts too, which cannot be found by their tag.
          echo "api=$(gh release view "$TAG" --json apiUrl -q .apiUrl)" >> "$GITHUB_OUTPUT"

  # Each distribution in a clean container: install the x64 packages from the release just made (no artefacts) and
  # try them (scripts/test-packages.sh). arm64 is not tried: no arm64 runners while the repository is private.
  test:
    needs: linux
    if: inputs.test
    name: test (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
          - image: ubuntu:26.04
          - image: debian:13
          - image: ubuntu:22.04
            what: loadtest # GStreamer 1.20: the load tool only
          - image: fedora:latest
          # Not RHEL 10 and its rebuilds: their GStreamer has no webrtcbin (PACKAGING-PLAN.md, step 5).
    container: ${{ matrix.image }}
    steps:
      # For scripts/test-packages.sh (without git in the container this downloads the files, which is enough).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Download the packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ needs.linux.outputs.release }}
        run: |
          # No gh or jq in a bare container: curl (installed first) and the release's asset list.
          if command -v apt-get >/dev/null; then apt-get update -q && apt-get install -y -q curl ca-certificates; fi
          mkdir -p packages && cd packages
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$RELEASE" \
            | grep -o '"url": *"[^"]*/releases/assets/[0-9]*"' | cut -d'"' -f4 \
            | while read -r url; do
                curl -fsSLOJ -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$url"
              done
          sha256sum -c --ignore-missing SHA256SUMS # the windows job may add MSIs meanwhile
          ls -l

      - name: Install and try
        run: sh scripts/test-packages.sh packages ${{ matrix.what || 'server+loadtest' }}

  # The MSIs, each with its own GStreamer (PACKAGING-PLAN.md "GStreamer on Windows"), added to the release the linux
  # job made. The pinned GStreamer installer is checked against its SHA-256, installed into a scratch folder, the
  # needed parts gathered, and then removed again, so that the test proves the MSIs use their own copy.
  windows:
    needs: linux
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GSTREAMER_VERSION: 1.28.8
      GSTREAMER_SHA256: e4c41ee6ee9c6c32a45d198463ec08d79bac3bd5fa58adc93d13fe4a08abc9d9
      PEFILE_VERSION: '2024.8.26'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      # The tags as on GitHub, with their messages (the release notes in the packages' changelog): a checkout for a
      # tag's push may keep that tag without its message.
      - name: Tags
        run: git fetch --force --tags origin

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache the GStreamer installer
        uses: actions/cache@v4
        with:
          path: gstreamer-installer
          key: gstreamer-msvc-x86_64-${{ env.GSTREAMER_VERSION }}

      - name: GStreamer (pinned)
        run: |
          $exe = "gstreamer-installer\gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe"
          if (-not (Test-Path $exe)) {
            New-Item -ItemType Directory -Force gstreamer-installer | Out-Null
            Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.exe" -OutFile $exe
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:GSTREAMER_SHA256) { throw "GStreamer installer checksum $hash, expected $env:GSTREAMER_SHA256" }
          # Inno Setup: silent, into a scratch folder.
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$env:RUNNER_TEMP\gst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GStreamer installer failed ($($p.ExitCode))" }
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\gst" -Filter gstreamer-1.0-0.dll | Select-Object FullName

      - name: Build the MSIs
        run: |
          python -m pip install --quiet "pefile==$env:PEFILE_VERSION"
          scripts\build-windows.ps1 -GStreamerRoot "$env:RUNNER_TEMP\gst" -GStreamerVersion $env:GSTREAMER_VERSION

      - name: Remove the build's GStreamer
        run: |
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\gst"
          foreach ($name in 'GSTREAMER_1_0_ROOT_MSVC_X86_64', 'GSTREAMER_1_0_ROOT_X86_64') {
            [Environment]::SetEnvironmentVariable($name, $null, 'Machine')
          }

      - name: Install and try the MSIs
        run: scripts\test-windows.ps1 -Dist dist

      - name: Add the MSIs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          Set-Location dist
          gh release download $env:TAG --pattern SHA256SUMS --clobber
          # LF line endings, as sha256sum writes and reads them.
          foreach ($msi in Get-ChildItem *.msi) {
            [IO.File]::AppendAllText("$PWD\SHA256SUMS", "$((Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant())  $($msi.Name)`n")
          }
          gh release upload $env:TAG (Get-ChildItem *.msi).Name SHA256SUMS --clobber
          # The linux job wrote the notes before these existed: add the Windows part, before the checksum line.
          $server = (Get-ChildItem SpatialAudioServer-[0-9]*-x64.msi).Name
          $loadtest = (Get-ChildItem SpatialAudioServer-LoadTest-*-x64.msi).Name
          $notes = (gh release view $env:TAG --json body --jq .body) -join "`n"
          $windows = @"
          Windows 10 or later and Windows Server 2019 or later, x64. Each MSI carries its own GStreamer, so nothing
          else needs installing. They are not signed: Windows may say "Windows protected your PC", then choose
          "More info" and "Run anyway". The server runs as the SpatialAudioServer service; its firewall rules are
          an optional feature.

              $server
              $loadtest

          "@
          $notes = $notes -replace '(?m)^Check the downloads', "$windows`nCheck the downloads"
          [IO.File]::WriteAllText("$PWD\notes.md", $notes)
          gh release edit $env:TAG --notes-file notes.md
