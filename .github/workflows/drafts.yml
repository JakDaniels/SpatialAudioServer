# Draft packages for testing (PACKAGING-PLAN.md "Branches and the GitHub workflows"): by hand only, from develop.
# They replace the files of the single pre-release "develop (draft)" (tag develop-draft, moved to the commit built):
# release files do not count against the Actions storage that workflow artefacts would fill. Pre-release versions
# only (0.2.1~alpha.0.N), so a draft is never mistaken for a release and the real one upgrades it cleanly.
# Now: Linux x64 .deb (server and load tool). Still to come: .rpm, arm64, the Windows MSIs.
name: drafts

on:
  workflow_dispatch:

permissions:
  contents: write # the develop (draft) release and its tag

concurrency:
  group: drafts
  cancel-in-progress: false

env:
  NFPM_VERSION: 2.48.0
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  linux:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: MinVer needs the tags and the commit count for the version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: nfpm
        run: |
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${archive}"
          echo "${NFPM_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "${archive}" -C /usr/local/bin nfpm
          nfpm --version | tail -n 4

      - name: Build the packages
        run: scripts/build-packages.sh x64

      - name: Replace the develop (draft) release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          # GitHub turns "~" in a release file's name into "." (0.2.1~alpha.0.5 → 0.2.1.alpha.0.5), which would no
          # longer match SHA256SUMS: name the files with the SemVer version instead. The version inside each package
          # (what apt reads and sorts by) keeps its "~".
          for f in *.deb; do mv "$f" "${f//\~/-}"; done
          sha256sum *.deb > SHA256SUMS
          version="$(ls spatialaudioserver_*_amd64.deb | sed -E 's/^spatialaudioserver_(.*)_amd64\.deb$/\1/')"
          cat > notes.md <<EOF
          Draft packages for testing, built from \`develop\` at ${GITHUB_SHA::7}: **${version}**. Not a release.

          Ubuntu 24.04 or later (server), 22.04 or later (load tool):

              sudo apt install ./spatialaudioserver_${version}_amd64.deb
              sudo apt install ./spatialaudioserver-loadtest_${version}_amd64.deb

          Check the downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`.
          EOF
          gh release delete develop-draft --yes --cleanup-tag || true
          gh release create develop-draft --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "develop (draft)" --notes-file notes.md *.deb SHA256SUMS
