<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC Echo Spike</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  button { font: inherit; padding: .4rem 1rem; margin-right: .5rem; }
  #state { font-weight: 600; }
  pre { background: #f4f4f4; padding: .75rem; max-height: 22rem; overflow: auto; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1b1b1b; color: #ddd; }
    pre { background: #262626; }
  }
</style>
</head>
<body>
<h1>WebRTC echo (Phase 0 spike)</h1>
<p>Sends your microphone to the server, which sends it straight back. Use headphones.
  Echo cancellation is off by default so you can hear yourself even through speakers; tick it if that howls.</p>
<p>
  <button id="start">Start</button><button id="stop" disabled>Stop</button>
  <label><input type="checkbox" id="aec"> echo cancellation</label>
</p>
<p>State: <span id="state">idle</span></p>
<audio id="remote" autoplay></audio>
<pre id="log"></pre>
<script>
const $ = id => document.getElementById(id);
const log = msg => { $("log").textContent += `${new Date().toISOString().slice(11, 23)} ${msg}\n`; };
let pc, stream, sessionId, polling;

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
  if (!r.ok) throw new Error(`${method} ${path}: ${r.status} ${await r.text()}`);
  return r.status === 204 ? null : r.json();
}

async function start() {
  $("start").disabled = true;
  try {
    const aec = $("aec").checked;
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: aec, noiseSuppression: aec, autoGainControl: aec }
    });
    pc = new RTCPeerConnection({ bundlePolicy: "max-bundle" });
    stream.getAudioTracks().forEach(t => pc.addTrack(t, stream));
    pc.ontrack = e => { $("remote").srcObject = e.streams[0] ?? new MediaStream([e.track]); log("remote track"); };
    pc.onconnectionstatechange = () => { $("state").textContent = pc.connectionState; log(`connection ${pc.connectionState}`); };

    // Candidates found before the server answers are held until there is a session to send them to.
    const pending = [];
    pc.onicecandidate = e => {
      if (!e.candidate) return;
      const c = { candidate: e.candidate.candidate, sdpMLineIndex: e.candidate.sdpMLineIndex ?? 0 };
      sessionId ? sendCandidate(c) : pending.push(c);
    };

    await pc.setLocalDescription(await pc.createOffer());
    const t0 = performance.now();
    const answer = await api("POST", "/api/sessions", { sdp: pc.localDescription.sdp });
    sessionId = answer.id;
    log(`answer in ${(performance.now() - t0).toFixed(0)} ms, session ${sessionId}`);
    await pc.setRemoteDescription({ type: "answer", sdp: answer.sdp });
    pending.splice(0).forEach(sendCandidate);
    pollCandidates();
    $("stop").disabled = false;
  } catch (e) {
    log(`error: ${e.message}`);
    await stop();
  }
}

function sendCandidate(c) {
  log(`local  ${c.candidate}`);
  api("POST", `/api/sessions/${sessionId}/candidates`, c).catch(e => log(`error: ${e.message}`));
}

async function pollCandidates() {
  let since = 0;
  const until = Date.now() + 15000;
  polling = true;
  while (polling && Date.now() < until) {
    const r = await api("GET", `/api/sessions/${sessionId}/candidates?since=${since}`);
    for (const c of r.candidates) {
      log(`remote ${c.candidate}`);
      await pc.addIceCandidate({ candidate: c.candidate, sdpMLineIndex: c.sdpMLineIndex });
      since++;
    }
    if (r.complete && pc.connectionState === "connected") break;
    await new Promise(res => setTimeout(res, 200));
  }
  polling = false;
}

async function stop() {
  polling = false;
  if (sessionId) await api("DELETE", `/api/sessions/${sessionId}`).catch(() => {});
  sessionId = null;
  pc?.close(); pc = null;
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  $("state").textContent = "idle";
  $("start").disabled = false; $("stop").disabled = true;
}

$("start").onclick = start;
$("stop").onclick = stop;
</script>
</body>
</html>
